name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  DEADCODE_VERSION: 0.48.0
  GOLANGCI_LINT_VERSION: 2.12.2
  STATICCHECK_VERSION: 0.7.0

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Prepare dependencies and CI tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ci-bin"
          echo "${RUNNER_TEMP}/ci-bin" >> "${GITHUB_PATH}"
          go mod download all
          go mod verify
          GOBIN="${RUNNER_TEMP}/ci-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          GOBIN="${RUNNER_TEMP}/ci-bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_LINT_VERSION}"
          GOBIN="${RUNNER_TEMP}/ci-bin" go install "honnef.co/go/tools/cmd/staticcheck@v${STATICCHECK_VERSION}"
          GOBIN="${RUNNER_TEMP}/ci-bin" go install "golang.org/x/tools/cmd/deadcode@v${DEADCODE_VERSION}"

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Tidy Go module
        run: go mod tidy

      - name: Check Go module files
        run: git diff --exit-code -- go.mod go.sum

      - name: Validate workflows
        run: actionlint .github/workflows/*.yml

      - name: Run Go tests with coverage
        run: go test -count=1 -coverprofile=coverage.out ./internal/...

      - name: Run Go tests with race detection
        run: go test -race -count=1 ./...

      - name: Enforce coverage
        shell: bash
        run: |
          set -euo pipefail
          uncovered_block="$(awk 'NR > 1 && $NF == 0 { print; exit }' coverage.out)"
          if [ -n "${uncovered_block}" ]; then
            printf '%s\n' "${uncovered_block}"
            echo "At least one handwritten statement block was not executed." >&2
            exit 1
          fi
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          if [ "${coverage}" != "100.0" ]; then
            echo "Expected 100.0% internal statement coverage; got ${coverage}%" >&2
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Detect dead code
        shell: bash
        run: |
          set -euo pipefail
          dead_code="$(deadcode ./...)"
          if [ -n "${dead_code}" ]; then
            printf '%s\n' "${dead_code}"
            exit 1
          fi

      - name: Build transcoder
        run: go build ./cmd/transcoder

      - name: Build waveform processor
        run: go build ./cmd/waveform-processor

      - name: Build and smoke test transcoder image
        shell: bash
        run: |
          set -euo pipefail
          image="geul-transcoder-ci:${GITHUB_SHA}"
          docker build --tag "${image}" .
          docker run --rm --entrypoint /bin/sh "${image}" -c 'test -x /app/service && ffmpeg -version >/dev/null'
          docker image rm --force "${image}"

      - name: Build and smoke test waveform image
        shell: bash
        run: |
          set -euo pipefail
          image="geul-waveform-processor-ci:${GITHUB_SHA}"
          docker build --build-arg BUILD_TARGET=./cmd/waveform-processor --tag "${image}" .
          docker run --rm --entrypoint /bin/sh "${image}" -c 'test -x /app/service && ffmpeg -version >/dev/null'
          docker image rm --force "${image}"

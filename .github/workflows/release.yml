name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.dsub.io
  TRANSCODER_IMAGE: registry.dsub.io/echovisionlab/geul-transcoder
  WAVEFORM_PROCESSOR_IMAGE: registry.dsub.io/echovisionlab/geul-waveform-processor
  PLATFORMS: linux/amd64

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create release PR or GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate release outputs
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag format: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Unsupported release sha format: ${RELEASE_SHA}" >&2
            exit 1
          fi
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${checkout_sha}" != "${RELEASE_SHA}" ]; then
            echo "Checked out ${checkout_sha}, expected release SHA ${RELEASE_SHA}." >&2
            exit 1
          fi

      - name: Validate registry credentials
        env:
          HARBOR_REGISTRY_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_REGISTRY_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in HARBOR_REGISTRY_USERNAME HARBOR_REGISTRY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "Missing secret: ${var}" >&2
              exit 1
            fi
          done

      - name: Log in to image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Set image metadata
        id: metadata
        run: echo "created_at=$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")" >> "${GITHUB_OUTPUT}"

      - name: Build and push transcoder image
        id: build-transcoder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created_at }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
            org.opencontainers.image.ref.name=${{ needs.release-please.outputs.tag_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-transcoder
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          tags: |
            ${{ env.TRANSCODER_IMAGE }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.TRANSCODER_IMAGE }}:sha-${{ needs.release-please.outputs.sha }}
          provenance: false
          sbom: false

      - name: Verify transcoder image digests
        id: transcoder-digest
        env:
          BUILD_DIGEST: ${{ steps.build-transcoder.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          version_digest="$(docker buildx imagetools inspect "${TRANSCODER_IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          sha_digest="$(docker buildx imagetools inspect "${TRANSCODER_IMAGE}:sha-${RELEASE_SHA}" --format '{{.Manifest.Digest}}')"
          if [ -z "${version_digest}" ] || [ "${version_digest}" != "${sha_digest}" ]; then
            echo "Transcoder release and SHA image tags do not resolve to the same digest." >&2
            exit 1
          fi
          if [ -n "${BUILD_DIGEST}" ] && [ "${BUILD_DIGEST}" != "${version_digest}" ]; then
            echo "Transcoder build output digest does not match the release tag digest." >&2
            exit 1
          fi
          echo "digest=${version_digest}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test transcoder image by digest
        env:
          RELEASE_DIGEST: ${{ steps.transcoder-digest.outputs.digest }}
        run: |
          set -euo pipefail
          image="${TRANSCODER_IMAGE}@${RELEASE_DIGEST}"
          docker pull "${image}"
          docker run --rm --entrypoint /bin/sh "${image}" -c 'test -x /app/service && ffmpeg -version >/dev/null'

      - name: Build and push waveform processor image
        id: build-waveform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: BUILD_TARGET=./cmd/waveform-processor
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created_at }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.sha }}
            org.opencontainers.image.ref.name=${{ needs.release-please.outputs.tag_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-waveform-processor
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
          tags: |
            ${{ env.WAVEFORM_PROCESSOR_IMAGE }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.WAVEFORM_PROCESSOR_IMAGE }}:sha-${{ needs.release-please.outputs.sha }}
          provenance: false
          sbom: false

      - name: Verify waveform processor image digests
        id: waveform-digest
        env:
          BUILD_DIGEST: ${{ steps.build-waveform.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          version_digest="$(docker buildx imagetools inspect "${WAVEFORM_PROCESSOR_IMAGE}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          sha_digest="$(docker buildx imagetools inspect "${WAVEFORM_PROCESSOR_IMAGE}:sha-${RELEASE_SHA}" --format '{{.Manifest.Digest}}')"
          if [ -z "${version_digest}" ] || [ "${version_digest}" != "${sha_digest}" ]; then
            echo "Waveform release and SHA image tags do not resolve to the same digest." >&2
            exit 1
          fi
          if [ -n "${BUILD_DIGEST}" ] && [ "${BUILD_DIGEST}" != "${version_digest}" ]; then
            echo "Waveform build output digest does not match the release tag digest." >&2
            exit 1
          fi
          echo "digest=${version_digest}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test waveform processor image by digest
        env:
          RELEASE_DIGEST: ${{ steps.waveform-digest.outputs.digest }}
        run: |
          set -euo pipefail
          image="${WAVEFORM_PROCESSOR_IMAGE}@${RELEASE_DIGEST}"
          docker pull "${image}"
          docker run --rm --entrypoint /bin/sh "${image}" -c 'test -x /app/service && ffmpeg -version >/dev/null'

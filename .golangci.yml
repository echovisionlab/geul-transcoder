version: "2"

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - funlen
    - ineffassign
    - gocyclo
    - nestif
    - revive
    - unparam
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 60
      statements: 40
    gocyclo:
      min-complexity: 11
    nestif:
      min-complexity: 2
run:
  timeout: 5m
